<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CodexとGitHubを使って作成・公開した、最初のWebページです。">
    <title>小さな一歩を、世界へ。｜GitHub練習</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <nav aria-label="メインナビゲーション">
        <a class="brand" href="#top" aria-label="GitHub練習 ホーム">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span>GitHub練習</span>
        </a>
        <a class="nav-link" href="#message">メッセージ</a>
      </nav>

      <section class="hero" id="top">
        <div class="eyebrow"><span aria-hidden="true"></span> First publish</div>
        <h1>小さな一歩を、<br><em>世界へ。</em></h1>
        <p class="lead">
          このページは Codex と GitHub を使って作成・公開しました。
          今日の練習が、次のアイデアにつながります。
        </p>
        <a class="button" href="#message">今日の成果を見る <span aria-hidden="true">↓</span></a>
        <div class="orbit orbit-one" aria-hidden="true"></div>
        <div class="orbit orbit-two" aria-hidden="true"></div>
        <div class="spark spark-one" aria-hidden="true">✦</div>
        <div class="spark spark-two" aria-hidden="true">✦</div>
      </section>

      <section class="message" id="message">
        <p class="section-number">01 — TODAY'S COMMIT</p>
        <div>
          <h2>公開できました！</h2>
          <p>
            コードを書く、変更を記録する、そしてWebに届ける。
            シンプルなページにも、確かな学びが詰まっています。
          </p>
        </div>
        <div class="status-card">
          <span class="status-dot" aria-hidden="true"></span>
          <div><strong>LIVE</strong><small>ページは公開中です</small></div>
        </div>
      </section>

      <footer><span>Built with curiosity.</span><span>2026</span></footer>
    </main>
  </body>
</html>
